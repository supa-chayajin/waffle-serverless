apiVersion: v1
kind: Secret
metadata:
  name: waffle-serverless-secret
  labels:
    app.kubernetes.io/name: waffle-serverless
type: Opaque
stringData:
  # ⚠️  GABARIT — NE PAS UTILISER TEL QUEL EN PRODUCTION. ⚠️
  # Le secret CSRF doit faire AU MOINS 32 octets, sinon le boot prod avorte
  # (fail-closed). En production, créez ce Secret HORS GIT, par exemple :
  #
  #   kubectl -n waffle-serverless create secret generic waffle-serverless-secret \
  #     --from-literal=WAFFLE_CSRF_SECRET="$(openssl rand -base64 48)"
  #
  # …ou gérez-le via Sealed Secrets / External Secrets. Ne committez jamais de
  # secret réel dans le dépôt.
  WAFFLE_CSRF_SECRET: "CHANGE-ME-demo-only-32-bytes-minimum-secret-AAAA"
