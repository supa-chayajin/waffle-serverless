# OPTIONNEL — autoscaling horizontal basé CPU.
#
# Prérequis : metrics-server installé dans le cluster (présent par défaut sur
# OVHcloud Managed Kubernetes). Lorsque vous activez l'HPA, RETIREZ le champ
# `spec.replicas` du Deployment (sinon chaque `kubectl apply` le remet à 2 et
# entre en conflit avec l'HPA).
#
# Application : kubectl -n waffle-serverless apply -f k8s/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: waffle-serverless
  namespace: waffle-serverless
  labels:
    app.kubernetes.io/name: waffle-serverless
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waffle-serverless
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
