# Configuration Mago — waffle-serverless (Waffle Beta 4).
# Politique Zéro-Baseline : aucun `baseline = ...`, zéro sortie (erreurs ET
# avertissements/infos). Corrections natives uniquement.
php-version = "8.5.6"

[source]
paths = ["src/", "tests/"]
includes = ["vendor"]
excludes = []

# -----------------------------------------------------------------------------
# Mago Guard — périmètre de dépendances.
# Le code applicatif vit sous `Wfl\` et ne consomme que l'écosystème
# waffle-commons (façade `Waffle\`), les PSR et les globales/PSL.
# -----------------------------------------------------------------------------
[guard]
mode = "default"
excludes = ["tests/bootstrap.php"]

[guard.perimeter]
layering = ["Wfl", "WflTests"]

[guard.perimeter.layers]
core = ["@global", "Psl\\**"]
psr = ["Psr\\**"]
waffle = ["Waffle\\**", "Waffle\\Commons\\**"]

[[guard.perimeter.rules]]
namespace = "Wfl"
permit = [
    "Wfl\\**",
    "@layer:core",
    "@layer:psr",
    "@layer:waffle",
]

[[guard.perimeter.rules]]
namespace = "WflTests"
permit = ["@all"]

[formatter]
print-width = 120
tab-width = 4
use-tabs = false
single-quote = true
trailing-comma = true
end-of-line = "lf"

[linter]
integrations = ["phpunit"]

[linter.rules]
# Sécurité — tolérance zéro.
no-insecure-comparison = { level = "error" }
no-literal-password = { level = "error" }
no-debug-symbols = { level = "error" }
disallowed-functions = { level = "error", functions = ["eval", "exec", "system", "shell_exec", "passthru", "phpinfo"] }

# Qualité — stricte.
prefer-interface = { level = "error" }
strict-types = { level = "error" }

# Métriques de volume désactivées : AppKernelFactory porte la complexité
# intrinsèque de l'amorçage (câblage du pipeline) — non capturée utilement ici.
cyclomatic-complexity = { enabled = false }
too-many-methods = { enabled = false }
kan-defect = { enabled = false }
halstead = { enabled = false }
literal-named-argument = { enabled = false }
# create(env, debug) est l'API d'amorçage canonique : `bool $debug` est délibéré.
no-boolean-flag-parameter = { enabled = false }

[analyzer]
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = true
strict-list-index-checks = true
strict-array-index-existence = true
